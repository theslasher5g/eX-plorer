name: Release

# Baut die Installer und veröffentlicht sie als GitHub-Release. Zwei Wege:
#  1. Tag pushen:  git tag -a v0.2.0 -m "eX-plorer 0.2.0" && git push origin v0.2.0
#  2. Actions → „Release“ → „Run workflow“ (Version stammt aus package.json,
#     der Tag wird dabei angelegt; die Datei muss dafür auf dem Standardbranch liegen).
# Neue Version vorher: `npm run version:set -- 0.2.0` und CHANGELOG.md ergänzen.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Installer bauen und veröffentlichen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Version prüfen (Tag = package.json = tauri.conf.json = Cargo.toml)
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="${GITHUB_REF_NAME#v}"; else tag="$pkg"; fi
          echo "RELEASE_TAG=v$tag" >> "$GITHUB_ENV"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "Tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Die Version im Tag stimmt nicht mit den Projektdateien überein. Mit 'npm run version:set -- $tag' angleichen."
            exit 1
          fi
          node scripts/release-notes.mjs "$tag" > release-notes.md

      - name: Frontend-Abhängigkeiten
        run: npm ci

      - name: Prüfen
        run: npm run check

      - name: Tests (Kern)
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Installer bauen (NSIS + MSI)
        run: npx tauri build

      - name: Prüfsummen
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi
          if ($files.Count -lt 2) { throw "Erwartet: NSIS-Installer und MSI, gefunden: $($files.Count)" }
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $files | Copy-Item -Destination dist-release
          Get-ChildItem dist-release | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist-release/SHA256SUMS.txt
          Get-Content dist-release/SHA256SUMS.txt

      - name: Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$RELEASE_TAG" in *-*) flags="--prerelease" ;; esac
          # Bei einem Tag-Push muss der Tag existieren; beim manuellen Start legt gh ihn an.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then flags="$flags --verify-tag"; else flags="$flags --target $GITHUB_SHA"; fi
          {
            cat release-notes.md
            echo
            echo "---"
            echo
            echo "**Installation:** \`eX-plorer_*_x64-setup.exe\` (pro Benutzer, ohne Administratorrechte) oder die \`.msi\` (systemweit, braucht Administratorrechte)."
            echo "Die Installer sind **nicht signiert**; Windows SmartScreen kann warnen. Prüfsummen: \`SHA256SUMS.txt\`."
          } > release-body.md
          gh release create "$RELEASE_TAG" dist-release/* \
            --title "eX-plorer ${RELEASE_TAG#v}" \
            --notes-file release-body.md $flags
