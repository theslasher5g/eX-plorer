name: Release

# Builds the installers and publishes them as a GitHub release. Two ways:
#  1. Push a tag:  git tag -a v0.2.0 -m "eX-plorer 0.2.0" && git push origin v0.2.0
#  2. Actions → "Release" → "Run workflow" (the version comes from package.json and
#     the tag is created; the workflow file must exist on the default branch).
# Beforehand: `npm run version:set -- 0.2.0` and add an entry to CHANGELOG.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build installers and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check version (tag = package.json = tauri.conf.json = Cargo.toml)
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="${GITHUB_REF_NAME#v}"; else tag="$pkg"; fi
          echo "RELEASE_TAG=v$tag" >> "$GITHUB_ENV"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "Tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::The version in the tag does not match the project files. Align them with 'npm run version:set -- $tag'."
            exit 1
          fi
          node scripts/release-notes.mjs "$tag" > release-notes.md

      - name: Frontend dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Tests
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Build installers (NSIS + MSI)
        run: npx tauri build

      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi
          if ($files.Count -lt 2) { throw "Expected the NSIS installer and the MSI, found: $($files.Count)" }
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $files | Copy-Item -Destination dist-release
          Get-ChildItem dist-release | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist-release/SHA256SUMS.txt
          Get-Content dist-release/SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$RELEASE_TAG" in *-*) flags="--prerelease" ;; esac
          # On a tag push the tag must exist; on a manual run gh creates it.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then flags="$flags --verify-tag"; else flags="$flags --target $GITHUB_SHA"; fi
          {
            cat release-notes.md
            echo
            echo "---"
            echo
            echo "**Install:** \`eX-plorer_*_x64-setup.exe\` (per user, no administrator rights needed) or the \`.msi\` (system-wide, needs administrator rights)."
            echo "The installers are **not code-signed**; Windows SmartScreen may warn. Checksums: \`SHA256SUMS.txt\`."
          } > release-body.md
          gh release create "$RELEASE_TAG" dist-release/* \
            --title "eX-plorer ${RELEASE_TAG#v}" \
            --notes-file release-body.md $flags
