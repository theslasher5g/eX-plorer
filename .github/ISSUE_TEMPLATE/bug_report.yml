name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please do not report security problems here**, follow the
        [security policy](../blob/main/SECURITY.md) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected. Screenshots or short GIFs help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Open the column view (Ctrl+3)
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: eX-plorer version
      placeholder: e.g. 0.1.0 (it is in the installer's file name)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 23H2 (build 22631)
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Local folder
        - OneDrive
        - Network drive / UNC
        - Removable drive
        - Context menu / shell extensions
        - Drag & drop
        - Installer
        - Other
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Special circumstances (very many files, security software, multiple monitors …).
