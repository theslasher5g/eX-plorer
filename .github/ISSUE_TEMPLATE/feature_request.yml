name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe the situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you imagine the solution?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What do you use today instead (e.g. Windows Explorer, Total Commander)?
