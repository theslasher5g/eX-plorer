[package]
name = "explorer-core"
description = "Plattformneutraler Kern von eX-plorer: Pfadvalidierung und Verzeichnislisting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
png = { version = "0.18", default-features = false }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
